name: RiftWardens Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/offline-idle-rpg-crafting-6jhb4h
    paths:
      - "RiftWardens/**"
      - ".github/workflows/riftwardens-android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3-stable"
      GODOT_VERSION_DIRNAME: "4.3.stable"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot editor + export templates
        run: |
          set -e
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d godot_bin
          sudo mv "godot_bin/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot4
          sudo chmod +x /usr/local/bin/godot4

          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIRNAME}"
          unzip -q templates.tpz -d /tmp/templates_extract
          mv /tmp/templates_extract/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIRNAME}/"

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot at the Android SDK + debug keystore
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install Android build template into project
        working-directory: RiftWardens
        run: godot4 --headless --install-android-build-template --path .

      - name: Export debug APK
        working-directory: RiftWardens
        run: |
          mkdir -p build
          godot4 --headless --export-debug "Android" build/RiftWardens.apk --path .
          ls -la build/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiftWardens-debug-apk
          path: RiftWardens/build/RiftWardens.apk
          if-no-files-found: error
